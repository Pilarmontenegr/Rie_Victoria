{% extends "base.html" %}
{% block content %}

<div class="nombreTablas">
    <p >Ventas</p>
</div>
<div class="row">
    <div class="col d-flex justify-content-end aling-items-end mb-3 col-10">
        <form method="GET">
            <div class="input-group">
                <input type="date" class="form-control" name="q" value="{{ query }}" placeholder="Fecha...">
                <button class="btn btn-transparent text-light" type="submit"><img src="/static/img/search.png" alt="Lupa de búsqueda" width="15" height="15"></button>
            </div>
        </form>
    <a class="btn btn-outline-primary" href="/ventas/VentasNuevo{{ p.id}}">Nueva venta</a></td>
    </div>
</div>
<table style="border-style: solid; border-color: palevioletred;" class="table table-striped">
            <!-- fila de una tabla -->
            <tr>
                <!-- columna dentro de la fila -->

                <th class="centrado">Código</th>
                <th >Fecha</th>
                <th>Cliente</th>
                <th></th>

            </tr>
            {% for p in Ventas %}

                <tr>
                    <!-- columna dentro de la fila -->
                    <td class="centrado"><a href="/ventas/VentasModif/{{ p.id }}">{{ p.id }}</a></td>
                    <!-- a href para hacerlo link -->
                    <td>{{p.fecha}}</td>
                    <td>{{p.idClientes}}</td>

                    <td>
                        <div class="d-flex justify-content-end ">
                            <a class="btn btn-outline-danger" href="/ventas/VentasBorrar/{{ p.id }}">Borrar</a>
                        </div>
                    </td>

                </tr>
                {% endfor %}
        </table>

    </div>
    </div>
    </div>
{% endblock %}
