{% block content %}

<div class="nombreTablas">

</div>
<div class="row">

    <a class="btn btn-outline-primary" href="/clientes/ClientesNuevo{{ p.id}}">Nuevo Cliente</a></td>
    </div>
</div>


<table style="border-style: solid; border-color: palevioletred;" class="table table-striped"> 
            <!-- fila de una tabla -->
            <tr>
                <!-- columna dentro de la fila -->

                <th>Código</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>DNI</th>
                <th>Telefono</th>
                <th></th>

            </tr>
            {% for p in Clientes %}

                <tr>
                    <!-- columna dentro de la fila -->
                    <td class="centrado"><a href="/clientes/ClientesModif/{{ p.id }}/">{{ p.id }}</a></td>
                    <!-- a href para hacerlo link -->
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.direccion }}</td>
                    <td>{{ p.DNI}}</td>
                    <td>{{ p.telefono }}</td>
    
                    <td>
                        <div class="d-flex justify-content-end ">
                            <a class="btn btn-outline-danger" href="/clientes/ClientesBorrar/{{ p.id}}">Borrar</a>
                        </div>
                    </td>

                </tr>
                {% endfor %}
        </table>

    </div>
    </div>
    </div>

{% endblock %}
