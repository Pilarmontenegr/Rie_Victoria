{% extends "base.html" %}
{% block content %}

    <h3 class="display-4 my-3">Borrar Articulo</h3>

    <p>¿Está seguro de borrar el articulo <b>{{ articulos.descripcion}}</b>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-primary" type="submit">Aceptar</button>
        <a class="btn btn-primary" href="{% url 'tabla' %}">Cancelar</a>
    </form>

{% endblock %}
