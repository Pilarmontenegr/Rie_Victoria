{% extends "base.html" %}
{% block content %}

<div class= "letra">
<div class="row">
    <h3 class="display-4 my-3">EMPLEADO</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botonguardar" type="submit">Guardar</button>
        <a class="botoncancelar" class= "botoncancelar:hover" href="{% url 'tablaempleados' %}">Cancelar</a>
    </form>
</div>
</div>
{% endblock %}
