{% extends "base.html" %}
{% block content %}

<div class="nombreTablas">
    <p >Proveedores</p>
</div>
    <div class="row">
        <div class="col d-flex justify-content-end  mb-3">
            <form method="GET">
                <div class="input-group">
                    <input type="text" class="form-control inputApagado " name="q" value="{{ query }}" placeholder="Buscar Proveedor...">
                    <button class="btn btn-outline-primary" 
                     type="submit"><img src="/static/img/search.png"  alt="Lupa de búsqueda" width="15" height="15" ></button>
                </div>
            </form>
        <a class="btn btn-outline-primary" href="/proveedores/ProveedoresNuevo{{ p.id}}">Nuevo Proveedor</a></td>
        </div>
    </div>

    

    <table style="border-style: solid; border-color: palevioletred;" class="table table-striped"> 
            <!-- fila de una tabla -->
            <tr>
                <!-- columna dentro de la fila -->

                <th>Código</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Cuit</th>
                <th></th>

            </tr>
            {% for p in Proveedores %}

                <tr> 

                    <!-- columna dentro de la fila -->
                    <td class="centrado"><a href="/proveedores/ProveedoresModif/{{ p.id }}/">{{ p.id }}</a></td>
                    <!-- a href para hacerlo link -->
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.direccion }}</td>
                    <td>{{ p.Email }}</td>
                    <td>{{ p.telefono }}</td>
                    <td>{{ p.cuit}}</td>
                    <td>
                        <div class="d-flex justify-content-end ">
                            <a class="btn btn-outline-danger" href="/proveedores/ProveedoresBorrar/{{ p.id}}">Borrar</a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
        </table>

    </div>
    </div>
    </div>

{% endblock %}
