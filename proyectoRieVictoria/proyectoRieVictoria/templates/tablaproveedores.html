{% extends "base.html" %}
{% block content %}

<div class="nombreTablas">
    <p >Proveedores</p>
</div>


    <!-- longitud de la tabla, el lenth -->
    <div class="descripcionProv">
        <h4>Total de proveedores: {{Proveedores|length}}</h4>
    </div>

    <div class="contenedorTabla">
        <div class="col-5">
    <div>

        <table class="table tablaBorde1 table-condensed table-striped">
            <!-- fila de una tabla -->
            <tr>
                <!-- columna dentro de la fila -->

                <th class="centrado">Código</th>
                <th >Descripción</th>

            </tr>
            {% for p in Proveedores %}

                <tr>
                    <!-- columna dentro de la fila -->
                    <td class="centrado" >{{p.id}}</td>
                    <!-- a href para hacerlo link -->
                    <td><a href="/proveedores/{{ p.id }}/">{{p.nombre}}</a></td>

                </tr>
                {% endfor %}
        </table>

    </div>
    </div>
    </div>

{% endblock %}
